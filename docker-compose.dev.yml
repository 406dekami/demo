services:
  neo4j:
    image: neo4j:5.12
    container_name: digital_logic_neo4j
    environment:
      NEO4J_AUTH: neo4j/DigitalLogic2024
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/plugins:/plugins  # APOC 插件目录
    networks:
      - graph_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: digital_logic_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - graph_network
    restart: unless-stopped

volumes:
  neo4j_data:
  redis_data:
  neo4j_logs:

networks:
  graph_network:
    driver: bridge
