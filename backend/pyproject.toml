[project]
name = "backend"
version = "0.1.0"
description = "backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "pydantic>=2.0.0",
    "peewee>=4.0.2",
    "uvicorn>=0.41.0",
    "chromadb>=0.5.0", # 向量数据库
    "dashscope>=1.20.0", # Qwen AI SDK
    "langchain>=0.3.0", # RAG 框架 (可选，简化开发)
    "langchain-community>=0.3.0", # 文档加载器
    "pypdf>=4.0.0", # PDF 解析
    "python-docx>=1.1.0", # Word 解析
    "tiktoken>=0.8.0", # Token 计数
    "httpx>=0.27.0", # HTTP 客户端
    "pytest>=9.0.2",
    "pdfplumber>=0.11.9",
    "sentence-transformers>=5.3.0",
    "qwen-vl-utils>=0.0.14",
    "python-multipart>=0.0.22",
    "pytest-asyncio>=0.21.0",
    "reportlab>=4.4.10",
    "pytest-timeout>=2.4.0",
    "boto3>=1.42.73",
    "boto3-stubs~=1.42.73",
    "neo4j>=5.12.0", # 图数据库驱动
    "redis>=5.0.0", # Redis 缓存
    "loguru>=0.7.0", # 日志库
    "olefile>=0.47", # .doc 文件解析
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uvicorn]
reload_dirs = ["app", "config"]
